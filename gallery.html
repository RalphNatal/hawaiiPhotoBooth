<!-- ─── Lightbox: dependency-free. Lives outside <main> so the rest of the page
     can be made inert while it is open. ───────────────────────────────────── -->
<div id="lightbox" class="fixed inset-0 z-50 hidden bg-abyss/95 p-4 md:p-8" role="dialog" aria-modal="true" aria-label="Photo viewer">

        <svg class="h-5 w-5" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M4 4l12 12M16 4L4 16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="relative mt-4 flex min-h-0 flex-1 items-center justify-center">
      <img id="lightbox-image" src="" alt="" class="max-h-full max-w-full rounded-lg object-contain ring-1 ring-white/15">
    </div>
    <div class="mt-4 flex items-center justify-between">

      <p id="lightbox-count" class="text-xs tracking-[0.01em] text-sand/60"></p>

<script>
(() => {
  // ── Filter ────────────────────────────────────────────────────────────────
  const chips = [...document.querySelectorAll('[data-filter]')];
  const figures = [...document.querySelectorAll('#gallery figure')];
  const status = document.getElementById('filter-status');
  const empty = document.getElementById('gallery-empty');

  function applyFilter(key) {
    chips.forEach((c) => c.setAttribute('aria-pressed', String(c.dataset.filter === key)));
    let shown = 0;
    figures.forEach((f) => {
      const show = key === 'all' || f.dataset.category === key;
      f.classList.toggle('hidden', !show);
      if (show) shown++;
    });
    empty.classList.toggle('hidden', shown > 0);
    const label = chips.find((c) => c.dataset.filter === key).textContent.trim();
    status.textContent = key === 'all' ? `Showing all ${shown} photos` : `Showing ${shown} ${label.toLowerCase()} photo${shown === 1 ? '' : 's'}`;
  }
  chips.forEach((c) => c.addEventListener('click', () => applyFilter(c.dataset.filter)));

  // ── Lightbox ──────────────────────────────────────────────────────────────
  const box = document.getElementById('lightbox');
  const img = document.getElementById('lightbox-image');
  const caption = document.getElementById('lightbox-caption');
  const count = document.getElementById('lightbox-count');
  const closeBtn = document.getElementById('lightbox-close');
  const prevBtn = document.getElementById('lightbox-prev');
  const nextBtn = document.getElementById('lightbox-next');
  const backdrop = document.getElementById('lightbox-backdrop');
  const outside = () => [...document.querySelectorAll('hb-nav, main, hb-footer')];

  let items = [];      // the currently visible figures, in order
  let index = -1;
  let trigger = null;  // the button that opened the lightbox; focus returns here

  function show(i) {
    index = (i + items.length) % items.length;
    const fig = items[index];
    const btn = fig.querySelector('button');
    const thumb = fig.querySelector('img');
    img.src = btn.dataset.full;
    img.alt = thumb.alt;
    caption.textContent = fig.querySelector('figcaption').textContent;
    count.textContent = `${index + 1} of ${items.length}`;
  }

  function open(fig, btn) {
    items = figures.filter((f) => !f.classList.contains('hidden'));
    trigger = btn;
    show(items.indexOf(fig));
    box.classList.remove('hidden');
    document.body.classList.add('overflow-hidden');
    // Modal: the rest of the page is inert while it is open. This is the one
    // place on the site where a focus trap is correct.
    outside().forEach((el) => { el.inert = true; });
    closeBtn.focus();
  }

  function close() {
    box.classList.add('hidden');
    document.body.classList.remove('overflow-hidden');
    outside().forEach((el) => { el.inert = false; });
    img.src = '';
    if (trigger) trigger.focus();
  }

  figures.forEach((fig) => {
    const btn = fig.querySelector('button');
    btn.addEventListener('click', () => open(fig, btn));
  });
  closeBtn.addEventListener('click', close);
  backdrop.addEventListener('click', close);
  prevBtn.addEventListener('click', () => show(index - 1));
  nextBtn.addEventListener('click', () => show(index + 1));

  box.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { e.preventDefault(); close(); return; }
    if (e.key === 'ArrowLeft') { e.preventDefault(); show(index - 1); return; }
    if (e.key === 'ArrowRight') { e.preventDefault(); show(index + 1); return; }
    if (e.key === 'Tab') {
      // Belt and braces alongside `inert`: keep Tab inside the dialog in
      // browsers that don't support the attribute.
      const focusable = [closeBtn, prevBtn, nextBtn];
      const i = focusable.indexOf(document.activeElement);
      if (e.shiftKey && (i <= 0)) { e.preventDefault(); focusable.at(-1).focus(); }
      else if (!e.shiftKey && i === focusable.length - 1) { e.preventDefault(); focusable[0].focus(); }
    }
  });
})();
</script>
